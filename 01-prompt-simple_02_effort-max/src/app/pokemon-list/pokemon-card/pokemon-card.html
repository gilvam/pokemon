<a class="pokemon-card" [routerLink]="['/pokemon', pokemon().name]">
  <span class="pokemon-card__number">{{ pokedexNumber() }}</span>
  <img
    class="pokemon-card__sprite"
    [src]="imageSrc()"
    [alt]="displayName()"
    width="96"
    height="96"
    loading="lazy"
    (error)="onImageError()"
  />
  <span class="pokemon-card__name">{{ displayName() }}</span>
</a>
